name: GitHub Pages

# Publishes the static site in `site/` to GitHub Pages.
#
# `site/` is generated by the verified tool (`wikidata publish data/*.wdkb --out site`)
# and committed, so the deployment needs no Lean toolchain.  `verify` re-checks that
# every file in the site matches the digest the tool recorded in `site/manifest.json`,
# which is the same check a peer performs on a mirrored copy.

on:
  push:
    branches: [main, master]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every published file against the manifest
        run: python3 scripts/verify_site.py site

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
