name = "RequestProject"
defaultTargets = ["THE-ERIKSSON-PROGRAMME", "monster", "ym-mass-gap-lean-verification"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "THE-ERIKSSON-PROGRAMME"
globs = ["THE-ERIKSSON-PROGRAMME.+"]

[[lean_lib]]
name = "monster"
globs = ["monster.+"]

[[lean_lib]]
name = "ym-mass-gap-lean-verification"
globs = ["ym-mass-gap-lean-verification.+"]
