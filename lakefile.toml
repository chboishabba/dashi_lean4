name = "RequestProject"
defaultTargets = ["Synthesis"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

# Cross-domain finite synthesis returned from Aristotle task bf6411b6.
[[lean_lib]]
name = "Synthesis"
globs = ["Synthesis.*"]

[[lean_lib]]
name = "Cuisine"
globs = ["Cuisine.*"]

[[lean_lib]]
name = "AgdaMirror"
globs = ["AgdaMirror", "AgdaMirror.*"]

# Reusable domain-neutral operators shared by Aristotle donor lanes.
[[lean_lib]]
name = "Spine"
globs = ["Spine", "Spine.*"]

# Cross-domain consolidation surfaces returned by TOE.  They remain opt-in:
# the default targets above stay small, while consumers can build these
# libraries explicitly when they need the associated source lanes.
[[lean_lib]]
name = "Integration"
globs = ["Integration", "Integration.*"]

[[lean_lib]]
name = "Promoted"
globs = ["Promoted", "Promoted.*"]

[[lean_lib]]
name = "AristotleArchive"
srcDir = "DASHI/output-final_aristotle"
globs = ["RequestProject.Core", "RequestProject.Engine", "RequestProject.Properties", "RequestProject.PropertyConstraints", "RequestProject.PropertyEngine", "RequestProject.Provenance", "RequestProject.Ranks", "RequestProject.Reachability", "RequestProject.Schemas", "RequestProject.Snaks", "RequestProject.StatementConstraints", "RequestProject.Temporal", "RequestProject.TypeProperties", "RequestProject.Archive", "RequestProject.Publish", "RequestProject.Cli.Format", "RequestProject.Sync", "RequestProject.Merge", "RequestProject.Worklist", "RequestProject.Reports", "RequestProject.ReportFormat", "RequestProject.Diagnostics", "RequestProject.SeriesDiagnostics", "RequestProject.TaxaDiagnostics", "RequestProject.KinshipDiagnostics", "RequestProject.ParentingDiagnostics", "RequestProject.Cli.Derive", "RequestProject.Cli.Query", "RequestProject.Examples", "RequestProject.FastEval", "RequestProject.Kinship", "RequestProject.Normalize", "RequestProject.Parenting", "RequestProject.Queries", "RequestProject.Redundancy", "RequestProject.SelfDescription", "RequestProject.Series", "RequestProject.SeriesChain", "RequestProject.SeriesExamples", "RequestProject.Taxa", "RequestProject.TaxaExamples", "RequestProject.TaxaLineage"]

[[lean_lib]]
name = "Proposed"
globs = ["Proposed.FibreRoutingProjectionAdapter"]

# The NS source is retained verbatim at this provenance location.  Pointing the
# opt-in cutset at it avoids a second lane-local copy.
[[lean_lib]]
name = "NSCutset"
srcDir = "ImportedLeans/aristotle-results/toe-fb55001e-20260912/output-final_aristotle/Provenance/ns-latest-20260912/payload"
globs = ["RequestProject.NavierStokes.AlmostOrthogonalGramSchur", "RequestProject.NavierStokes.GramConsumerFactorisation", "RequestProject.NavierStokes.OperatorSchurBlockCancellation", "RequestProject.NavierStokes.RateBlockGramBound", "RequestProject.NavierStokes.ResolventGramFlux", "RequestProject.NavierStokes.ResolventHeatFactorization", "RequestProject.NavierStokes.SignedGramWienerAssembly", "RequestProject.NavierStokes.SignedRemainderResolventBudget", "RequestProject.NavierStokes.SignedRemainderTTStar", "RequestProject.NavierStokes.SlotKernelAntiParallel", "RequestProject.NavierStokes.SpineRateBlockAdapter", "RequestProject.NavierStokes.TransverseFrameSplit", "RequestProject.NavierStokes.WaleffeAmplitude", "RequestProject.NavierStokes.WaleffeBetweenBlockGram", "RequestProject.NavierStokes.WaleffeCriticalCompanionSummation", "RequestProject.NavierStokes.WaleffeExternalBonyClasses", "RequestProject.NavierStokes.WaleffeExternalCrossTriadCells", "RequestProject.NavierStokes.WaleffeExternalForcingSplit", "RequestProject.NavierStokes.WaleffeForcingMajorant", "RequestProject.NavierStokes.WaleffeGalerkinEnergy", "RequestProject.NavierStokes.WaleffeHighHighOutputGain", "RequestProject.NavierStokes.WaleffeIntegratedPayment", "RequestProject.NavierStokes.WaleffeNetworkForcingBudget", "RequestProject.NavierStokes.WaleffeOutputGainFibre", "RequestProject.NavierStokes.WaleffeSelfForcingSign", "RequestProject.NavierStokes.WaleffeSelfPhaseEnergyPayment", "RequestProject.NavierStokes.WaleffeSerrinReduction", "RequestProject.NavierStokes.WaleffeTriadInternalPayment", "RequestProject.NavierStokes.WaleffeWienerBudget", "RequestProject.NavierStokes.WaleffeWienerSupercritical"]

# TOE task 759f2a06's retained NS proof-search library.  It stays opt-in and
# consumes the prior NSCutset Waleffe payload where needed; importing the
# source from its provenance location avoids a second edited copy.
[[lean_lib]]
name = "NSUnforced"
srcDir = "ImportedLeans/aristotle-results/toe-759f2a06-20260915/output-final_aristotle/Lean"
globs = ["NSUnforced", "NSUnforced.*"]

# Dedicated NS worker task 5fb665d1: active periodic-B frontier welds.  This
# library consumes the retained NSCutset and NSUnforced sources rather than
# duplicating either carrier.
[[lean_lib]]
name = "NSBFrontier"
srcDir = "ImportedLeans/aristotle-results/ns-5fb665d1-20260915/output-final_aristotle"
globs = ["RequestProject.NavierStokes.R571RadialCurvature", "RequestProject.NavierStokes.R571PairedSecondMoment", "RequestProject.NavierStokes.HeterochiralOutputGain", "RequestProject.NavierStokes.ProofDebtRouterMirror", "RequestProject.NavierStokes.TrancheAxiomAudit20260915"]

# Dedicated NS worker task 83c905e8: literal periodic-B control carrier.
# This remains opt-in, reuses NSCutset's Galerkin carrier, and does not turn
# its stated S2b target or its upstream build receipt into a local closure.
[[lean_lib]]
name = "NSBControl"
srcDir = "ImportedLeans/aristotle-results/ns-83c905e8-20260916"
globs = ["RequestProject.NavierStokes.CriticalDyadicWeight", "RequestProject.NavierStokes.CriticalWeightedGalerkin", "RequestProject.NavierStokes.CriticalProductionAbsorption", "RequestProject.NavierStokes.CriticalProductionWitness", "RequestProject.NavierStokes.CriticalWeightDifferenceTransfer", "RequestProject.NavierStokes.TrancheAxiomAudit20260915B"]

# Yang--Mills final-lane source returned by Aristotle task 7c8ef02f.  It is
# opt-in and retains the worker's full dependency surface as provenance; its
# physical endpoint remains governed by the explicit hypotheses in that lane.
[[lean_lib]]
name = "YMFinal"
srcDir = "ImportedLeans/aristotle-results/ym-7c8ef02f-20260916"
globs = ["RequestProject.YangMills.*"]

[[lean_lib]]
name = "Welds"
globs = ["Welds", "Welds.*"]

[[lean_lib]]
name = "TriadicKernelAlgebra"
srcDir = "DASHI/Klüver’s Form Constants_aristotle"

# Archive 1: DASHI↔Lean bridge (Agda vendor + direct Agda checking).
[[lean_lib]]
name = "AgdaVendor"
srcDir = "DASHI/output-final_aristotle"
globs = ["AgdaVendor", "AgdaVendor.*"]

[[lean_lib]]
name = "AgdaCheck"
srcDir = "DASHI/output-final_aristotle"
globs = ["AgdaCheck", "AgdaCheck.*"]

# Archive 2: executable Wikidata ontology engine CLI.
[[lean_exe]]
name = "wikidata"
root = "RequestProject.Cli.Tool"
srcDir = "DASHI/output-final_aristotle"
