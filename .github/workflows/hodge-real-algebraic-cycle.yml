name: Hodge genuine algebraic-cycle donor

on:
  push:
    branches:
      - 'agent/hodge-real-algebraic-cycle-v435-20261002'
    paths:
      - 'Synthesis/MillenniumHodgeRealAlgebraicCycleMultiplicityExact.lean'
      - 'Synthesis/MillenniumHodgeP1xP1PrimitiveRulingRegressionExact.lean'
      - 'Synthesis/MillenniumHodgeActualCycleCorrespondenceActionExact.lean'
      - 'Synthesis/MillenniumHodgeRelativeProductSwapExact.lean'
      - 'Synthesis.lean'
      - 'lean-toolchain'
      - 'lakefile.toml'
      - '.github/workflows/hodge-real-algebraic-cycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Resolve current Mathlib
        run: lake update
      - name: Kernel check real algebraic-cycle multiplicity donor
        run: |
          lake env lean Synthesis/MillenniumHodgeRealAlgebraicCycleMultiplicityExact.lean
          lake env lean Synthesis/MillenniumHodgeP1xP1PrimitiveRulingRegressionExact.lean
          lake env lean Synthesis/MillenniumHodgeActualCycleCorrespondenceActionExact.lean
          lake env lean Synthesis/MillenniumHodgeRelativeProductSwapExact.lean
