name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Build forecast verification integration
        run: lake build Integration.ForecastVerification

  external-clay-ns:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Build pinned literal Clay NS project
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ExternalClayNS
