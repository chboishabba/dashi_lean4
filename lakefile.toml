# including the B3 one-sided lattice-time geometry and its Route-S consumers.
# It remains opt-in; its physical endpoint is governed by explicit hypotheses.
[[lean_lib]]
name = "YMFinal"
srcDir = "ImportedLeans/aristotle-results/ym-bd2d4841-20260921"
