name = "RequestProject"
defaultTargets = ["Main", "NavierStokesClosure", "SpectralClosure", "YangMillsClosure", "TriadicKernelAlgebra", "FormConstantGeometry"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "Main"
globs = ["Main"]

[[lean_lib]]
name = "NavierStokesClosure"
globs = ["NavierStokesClosure"]

[[lean_lib]]
name = "SpectralClosure"
globs = ["SpectralClosure"]

[[lean_lib]]
name = "YangMillsClosure"
globs = ["YangMillsClosure"]

[[lean_lib]]
name = "TriadicKernelAlgebra"
globs = ["TriadicKernelAlgebra"]

[[lean_lib]]
name = "FormConstantGeometry"
globs = ["FormConstantGeometry"]
