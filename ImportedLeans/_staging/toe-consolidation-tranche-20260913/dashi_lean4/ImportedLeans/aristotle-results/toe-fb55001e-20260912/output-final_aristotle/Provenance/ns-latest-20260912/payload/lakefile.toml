name = "RequestProject"
defaultTargets = ["RequestProject"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

# The domain-neutral Spine kernels that the Navier-Stokes lane actually
# consumes.  `Lean/` is the vendored TOE Lean corpus; only the modules named
# here are on the build surface, so nothing else in that tree is compiled.
[[lean_lib]]
name = "Spine"
srcDir = "Lean"
globs = ["Spine.RateBlockSchur"]

# TOE's consumer-relative projection prototype, reused by the NS lane in
# `RequestProject.NavierStokes.GramConsumerFactorisation`.
[[lean_lib]]
name = "Proposed"
srcDir = "Lean"
globs = ["Proposed.FibreRoutingProjectionAdapter"]
