name: Millennium external target acceptance

on:
  push:
    branches:
      - agent/millennium-external-target-adapters-20261006
    paths:
      - 'MillenniumExternal/**'
      - 'ExternalClayNS/**'
      - 'scripts/vendor_millennium_targets.sh'
      - 'scripts/audit_millennium_external_targets.py'
      - 'scripts/test_audit_millennium_external_targets.py'
      - 'scripts/export_millennium_frontier.py'
      - 'scripts/test_export_millennium_frontier.py'
      - 'scripts/check_millennium_external_source.py'
      - 'scripts/check_millennium_external_trust.sh'
      - 'vendor/LeanMillenniumPrizeProblems.VENDOR'
      - 'vendor/LeanMillenniumPrizeProblems'
      - '.gitmodules'
      - '.github/workflows/millennium-external-targets.yml'
  pull_request:
    paths:
      - 'MillenniumExternal/**'
      - 'ExternalClayNS/**'
      - 'scripts/vendor_millennium_targets.sh'
      - 'scripts/audit_millennium_external_targets.py'
      - 'scripts/test_audit_millennium_external_targets.py'
      - 'scripts/export_millennium_frontier.py'
      - 'scripts/test_export_millennium_frontier.py'
      - 'scripts/check_millennium_external_source.py'
      - 'scripts/check_millennium_external_trust.sh'
      - 'vendor/LeanMillenniumPrizeProblems.VENDOR'
      - 'vendor/LeanMillenniumPrizeProblems'
      - '.gitmodules'
      - '.github/workflows/millennium-external-targets.yml'
  workflow_dispatch:

permissions:
  contents: read
nconcurrency:
  group: millennium-external-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-and-dashi:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout DASHI and exact external target submodule
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Verify immutable vendor pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor/LeanMillenniumPrizeProblems rev-parse HEAD)" = \
            603053dc267cf3efe422f438eb78098c0ececd6f
          test "$(cat vendor/LeanMillenniumPrizeProblems/lean-toolchain)" = \
            'leanprover/lean4:v4.31.0'

      - name: Test and audit external registry/frontier
        run: |
          python3 scripts/test_audit_millennium_external_targets.py
          python3 scripts/test_export_millennium_frontier.py
          python3 scripts/export_millennium_frontier.py > millennium-external-frontier.json
          python3 scripts/check_millennium_external_source.py
          python3 scripts/audit_millennium_external_targets.py
          bash scripts/check_millennium_external_trust.sh

      - name: Install DASHI Lean environment
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false

      - name: Build upstream with its own toolchain and package graph
        shell: bash
        run: |
          set -euo pipefail
          elan toolchain install leanprover/lean4:v4.31.0
          cd vendor/LeanMillenniumPrizeProblems
          elan run leanprover/lean4:v4.31.0 lake update
          elan run leanprover/lean4:v4.31.0 lake build Problems

      - name: Probe exact vendored targets in the DASHI kernel
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake env bash -c '
            set -euo pipefail
            export LEAN_PATH="$PWD/vendor/LeanMillenniumPrizeProblems:$LEAN_PATH"
            lean MillenniumExternal/ExactTargetSurface.lean
          ' 2>&1 | tee millennium-external-same-kernel.log

      - name: Build literal NS same-object transport against exact LeanDojo targets
        shell: bash
        run: |
          set -euo pipefail
          elan toolchain install leanprover/lean4:v4.34.0-rc2
          (
            cd ExternalClayNS
            lake update
            lake env bash -c '
              set -euo pipefail
              export LEAN_PATH="$PWD/../vendor/LeanMillenniumPrizeProblems:$LEAN_PATH"
              lean LeanDojoBoundaryExtension.lean
              lean LeanDojoSameObjectCore.lean
              lean LeanDojoCoordinateLinearEquiv.lean
              lean LeanDojoJetTransport.lean
              lean LeanDojoSameObject.lean
              lean LeanDojoForceTransport.lean
              lean LeanDojoSolutionTransport.lean
              lean LeanDojoEnergyTransport.lean
              lean LeanDojoTargetBridge.lean
              lean LeanDojoSameObjectRegression.lean
            '
          ) 2>&1 | tee millennium-external-ns-leandojo.log

      - name: Build DASHI terminal census and axiom audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean MillenniumExternal/All.lean 2>&1 | tee millennium-external-dashi.log

      - name: Upload DASHI axiom audit logs and machine frontier
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: millennium-external-dashi-audit
          path: |
            millennium-external-frontier.json
            millennium-external-same-kernel.log
            millennium-external-ns-leandojo.log
            millennium-external-dashi.log
          if-no-files-found: warn
