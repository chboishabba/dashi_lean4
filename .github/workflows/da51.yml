name: DA51

on:
  pull_request:
    paths:
      - 'DA51.lean'
      - 'DA51/**'
      - 'fixtures/da51_v1.json'
      - '.github/workflows/da51.yml'
  workflow_dispatch:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared fixture bytes
        run: echo 'cc67f109e5be3cfea89d7a8e0ba2b1b6279b5f012d751efbdb7e3a971e957106  fixtures/da51_v1.json' | sha256sum --check -
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Check DA51 core
        run: lake env lean DA51/Core.lean
      - name: Check DA51 atlas codec
        run: lake env lean DA51/Atlas.lean
      - name: Check DA51 golden fixtures
        run: lake env lean DA51/Fixtures.lean
      - name: Check DA51 aggregate
        run: lake env lean DA51.lean
