[[lean_lib]]
name = "YMBidi"
srcDir = "ImportedLeans/aristotle-results/ym-bidi-task-449b959c-20260916/output-final_aristotle"
globs = ["RequestProject.YangMills.BIDI.*"]

# Conditional Clay assembly returned by Aristotle task 3eea48e0.  This library
# is opt-in and exposes the form->Hamiltonian compiler, bounded-core/evolution
