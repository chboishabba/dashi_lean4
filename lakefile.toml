globs = ["RequestProject.NavierStokes.CanonicalCompletionLeaves"]

# Native mathlib-backed continuum Yang--Mills analysis.  This lane is reserved
# for genuine measure/topology/spectral theorems whose supporting infrastructure
# is materially stronger in mathlib than in the Agda foundation.
[[lean_lib]]
name = "YMContinuum"
globs = ["YangMills.*"]


# Independent mirror of the live Agda R702/R703 cyclic-helical max-cut.
# This proves only exact leg/coefficient bookkeeping; it makes no Clay or
