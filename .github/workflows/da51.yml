name: DA51

on:
  pull_request:
    paths:
      - 'DA51.lean'
      - 'DA51/**'
      - 'fixtures/da51_v1.json'
      - 'lakefile.toml'
      - '.github/workflows/da51.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify shared fixture bytes
        run: echo '3a2f191afd465b52ba1db7774c0cf3d02d1ee4f099ea62cd33802ab52293cd75  fixtures/da51_v1.json' | sha256sum --check -
      - uses: leanprover/lean-action@v1
        with:
          build: false
      - name: Build DA51 library
        run: lake build DA51
      - name: Check DA51 core
        run: lake env lean DA51/Core.lean
      - name: Check DA51 atlas codec
        run: lake env lean DA51/Atlas.lean
      - name: Check DA51 provenance
        run: lake env lean DA51/Provenance.lean
      - name: Check DA51 golden fixtures
        run: lake env lean DA51/Fixtures.lean
      - name: Check DA51 aggregate
        run: lake env lean DA51.lean
