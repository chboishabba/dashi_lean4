name: RH SSP15 Same-Graph Weld

on:
  workflow_dispatch:
  push:
    branches:
      - agent/rh-ssp15-same-graph-weld-20260928
    paths:
      - "Synthesis/RiemannQuarticProducerRoleCertificate.lean"
      - "Integration/RiemannPrimitiveKernel*.lean"
      - "Integration/RiemannSSP15*.lean"
      - ".github/workflows/rh-ssp15-same-graph.yml"
  pull_request:
    paths:
      - "Synthesis/RiemannQuarticProducerRoleCertificate.lean"
      - "Integration/RiemannPrimitiveKernel*.lean"
      - "Integration/RiemannSSP15*.lean"
      - ".github/workflows/rh-ssp15-same-graph.yml"

permissions:
  contents: read

jobs:
  weld:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false

      - name: Kernel-check RH producer certificate
        run: |
          lake env lean Synthesis/RiemannQuarticProducerRoleCertificate.lean
          lake env lean Synthesis/AxiomAuditRiemannQuarticProducerRoleCertificate.lean

      - name: Kernel-check SSP15 dependency closure
        run: |
          lake env lean Integration/RiemannPrimitiveKernelBalancedTernaryStencil.lean
          lake env lean Integration/RiemannPrimitiveKernelUnimodularBasis.lean
          lake env lean Integration/RiemannPrimitiveKernelMod243Filtration.lean
          lake env lean Integration/RiemannPrimitiveKernelExplicitSmithReduction.lean
          lake env lean Integration/RiemannPrimitiveKernelSmithFiltrationSeparation.lean
          lake env lean Integration/RiemannSSP15DepthFiveRoleCodec.lean
          lake env lean Integration/RiemannSSP15ChosenGridTransversality.lean
          lake env lean Integration/RiemannSSP15SignedProvenanceBridge.lean
          lake env lean Integration/RiemannSSP15PartitionSeparation.lean
          lake env lean Integration/RiemannSSP15SignedFRACTRAN.lean
          lake env lean Integration/RiemannSSP15FilteredProvenanceCapstone.lean

      - name: Kernel-check same-graph weld
        run: |
          lake env lean Integration/RiemannSSP15RHProducerSameGraphWeld.lean
          lake env lean Integration/AxiomAuditRiemannSSP15RHProducerSameGraphWeld.lean
