name: E6 F3 PGSp closure

on:
  pull_request:
    paths:
      - "Integration/F3E6PGSpClosure.lean"
      - "Integration/F3E6PGSpClosureRegression.lean"
      - "Integration/F3E6PGSpSameObjectBridge.lean"
      - "Integration/F3E6PGSpGeneratorBridge.lean"
      - "Integration/F3FourSymplecticExteriorSquare.lean"
      - "Integration/GeometricReasoningEverything.lean"
      - "scripts/verify_f3_e6_pgsp_closure.py"
      - ".github/workflows/e6-f3-pgsp-closure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Check existing same-object bridge
        run: lake env lean Integration/F3E6PGSpSameObjectBridge.lean
      - name: Check finite closure owner
        run: lake env lean Integration/F3E6PGSpClosure.lean
      - name: Check finite closure regression
        run: lake env lean Integration/F3E6PGSpClosureRegression.lean
      - name: Check geometric reasoning rollup
        run: lake env lean Integration/GeometricReasoningEverything.lean
      - name: Verify independent closure computation
        run: python3 scripts/verify_f3_e6_pgsp_closure.py
