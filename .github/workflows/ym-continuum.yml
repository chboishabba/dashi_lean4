name: YM Continuum Lean

on:
  push:
    branches:
      - agent/ym-selected-covariance-limit-20260922
    paths:
      - "YangMills/**"
      - "lakefile.toml"
      - "lean-toolchain"
      - ".github/workflows/ym-continuum.yml"
  pull_request:
    paths:
      - "YangMills/**"
      - "lakefile.toml"
      - "lean-toolchain"
      - ".github/workflows/ym-continuum.yml"
  workflow_dispatch:

jobs:
  build-ym-continuum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact finite SU(2) quaternion diagnostic
        run: python3 scripts/ym_finite_su2_exact_audit.py
      - uses: leanprover/lean-action@v1
        with:
          build-args: YMContinuum
