name: Singular basin Lean kernel

on:
  pull_request:
    paths:
      - 'AgdaMirror/Dynamics/SingularBasin*.lean'
      - '.github/workflows/singular_basin_lean_ci.yml'
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Check singular-basin logical core
        run: |
          lake env lean AgdaMirror/Dynamics/SingularBasinReduction.lean
          lake env lean AgdaMirror/Dynamics/SingularBasinFiniteWitness.lean
