# Cloudflare Pages configuration for the published ontology site.
#
#   wrangler pages deploy site --project-name wikidata-ontology-lean
#
# `site/_headers` and `site/_redirects` (both generated by `wikidata publish`)
# carry the CORS, content-type and short-link rules, so the same directory
# deploys unchanged to Cloudflare Pages, Vercel, GitHub Pages and Toolforge.

name = "wikidata-ontology-lean"
pages_build_output_dir = "site"
compatibility_date = "2025-01-01"

[vars]
ONTOLOGY_MANIFEST = "/manifest.json"
