name = "RequestProject"
defaultTargets = ["RequestProject", "AgdaVendor", "AgdaCheck"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "AgdaVendor"
globs = ["AgdaVendor.+"]

[[lean_lib]]
name = "AgdaCheck"
globs = ["AgdaCheck.+"]

[[lean_exe]]
name = "wikidata"
root = "RequestProject.Cli.Tool"
