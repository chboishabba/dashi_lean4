    branches:
      - collatz-syracuse-parity-cylinder-20261006
  pull_request:
    paths:
      - 'AgdaMirror/CollatzSyracuseInv3Exact.lean'
      - '.github/workflows/collatz-syracuse-parity-cylinder.yml'
  workflow_dispatch:

jobs:
