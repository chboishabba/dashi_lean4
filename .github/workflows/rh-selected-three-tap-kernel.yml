name: RH selected three-tap kernel
on:
  push:
    branches:
      - agent/rh-marked-cluster-target-reflection
    paths:
      - 'Synthesis/RiemannSelectedPrimeSensitiveThreeTap*.lean'
      - 'Synthesis/RiemannSelectedPrimeSensitiveTwoScale.lean'
      - '.github/workflows/rh-selected-three-tap-kernel.yml'
  pull_request:
    paths:
      - 'Synthesis/RiemannSelectedPrimeSensitiveThreeTap*.lean'
      - 'Synthesis/RiemannSelectedPrimeSensitiveTwoScale.lean'
      - '.github/workflows/rh-selected-three-tap-kernel.yml'
  workflow_dispatch:

jobs:
  selected-three-tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Kernel check literal prime, completed source, increment and terminal audits
        run: |
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapTwoPrime
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapCompleted
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapIncrementAudit
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapTerminalTest
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapTargetMoment
          lake build Synthesis.RiemannSelectedPrimeSensitiveSymmetricShiftMoments
          lake build Synthesis.RiemannSelectedSignedFifthTerminalBridge
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapTerminalized
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapNearLine
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapLocalBudget
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapJ2Polynomial
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapAdaptiveMixed
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapAdaptiveJet
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapAdaptiveLocalDebt
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapAdaptiveTerminal
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapAdaptiveGlobal
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapAdaptiveOffOrdWeld
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapJ2Phase
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapJ2Normalized
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapAdaptiveRemainder
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapNormalizedProjective
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapJ2SignRegion
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapPaidCostCut
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapMaxCutClosure
          lake build Synthesis.RiemannSelectedPrimeSensitiveThreeTapMaxCutComplete
          lake build Synthesis.RiemannSelectedPrimeSensitiveTwoScale
