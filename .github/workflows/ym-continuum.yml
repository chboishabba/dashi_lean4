name: YM Continuum Lean

on:
  pull_request:
    paths:
      - "YangMills/**"
      - "lakefile.toml"
      - "lean-toolchain"
      - ".github/workflows/ym-continuum.yml"
  workflow_dispatch:

jobs:
  build-ym-continuum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: YMContinuum
