name: 2B post-Brauer final compiler

on:
  workflow_dispatch:
  push:
    branches:
      - agent/2b-same-object-final-maxcut-20261007
    paths:
      - 'Integration/OggSSP2BTate276M24BrauerRuntimeReceipt.lean'
      - 'Integration/OggSSP2BActualStableCompletionSubquotient.lean'
      - 'Integration/OggSSP2BPostBrauerFinalCompiler.lean'
      - '.github/workflows/twob-post-brauer-final.yml'
  pull_request:
    paths:
      - 'Integration/OggSSP2BTate276M24BrauerRuntimeReceipt.lean'
      - 'Integration/OggSSP2BActualStableCompletionSubquotient.lean'
      - 'Integration/OggSSP2BPostBrauerFinalCompiler.lean'
      - '.github/workflows/twob-post-brauer-final.yml'

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
      - name: Download Mathlib cache
        run: lake exe cache get
      - name: Check post-Brauer 2B owners
        run: |
          lake env lean Integration/OggSSP2BTate276M24BrauerRuntimeReceipt.lean
          lake env lean Integration/OggSSP2BActualStableCompletionSubquotient.lean
          lake env lean Integration/OggSSP2BPostBrauerFinalCompiler.lean
